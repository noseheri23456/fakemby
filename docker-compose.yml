services:
  fakemby:
    image: ${FAKEMBY_IMAGE:-fakemby:local}
    build:
      context: .
      dockerfile: Dockerfile
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777

    ports:
      - "${FAKEMBY_BIND_ADDRESS:-127.0.0.1}:${FAKEMBY_PUBLISHED_PORT:-8096}:8096"
    volumes:
      # A fresh named volume inherits UID/GID 10001 from the image.
      # Before upgrading, migrate the old bind-mounted database (see CHANGELOG).
      - fakemby-data:/app/data
      # Optional configuration; environment values below take precedence.
      # - ./config.yaml:/app/config.yaml:ro

    environment:
      CONFIG_FILE: /app/config.yaml
      FAKEMBY_SERVER_HOST: "0.0.0.0"
      FAKEMBY_SERVER_PORT: "8096"
      FAKEMBY_SERVER_NAME: "${FAKEMBY_SERVER_NAME:-FakEmby Server}"
      # Emby protocol compatibility version, not the application release version.
      FAKEMBY_SERVER_VERSION: "4.8.0.0"
      FAKEMBY_DATABASE_PATH: /app/data/fakemby.db
      FAKEMBY_DATABASE_WAL_MODE: "true"
      FAKEMBY_AUTH_TOKEN_EXPIRY_DAYS: "${FAKEMBY_AUTH_TOKEN_EXPIRY_DAYS:-30}"
      FAKEMBY_IMAGE_MODE: "${FAKEMBY_IMAGE_MODE:-proxy_cache}"
      FAKEMBY_IMAGE_CACHE_DIR: /app/data/cache/images
      FAKEMBY_IMAGE_CACHE_MAX_MB: "${FAKEMBY_IMAGE_CACHE_MAX_MB:-512}"
      FAKEMBY_PLAYBACK_REDIRECT: "true"
      FAKEMBY_PLAYBACK_SIGN_TTL: "${FAKEMBY_PLAYBACK_SIGN_TTL:-3600}"
      # Export these from the shell or a secret manager before running Compose.
      # No *_FILE/config secret_file support exists. Never commit secret values.
      # Environment values are visible to Docker administrators; do not share
      # rendered `docker compose config` output containing production secrets.
      FAKEMBY_ADMIN_API_KEY: "${FAKEMBY_ADMIN_API_KEY:?Export a strong FAKEMBY_ADMIN_API_KEY}"
      FAKEMBY_PLAYBACK_SIGN_KEY: "${FAKEMBY_PLAYBACK_SIGN_KEY:?Export a persistent FAKEMBY_PLAYBACK_SIGN_KEY}"
      FAKEMBY_LOG_LEVEL: "${FAKEMBY_LOG_LEVEL:-info}"
      # The logger always writes stderr; disable the additional file sink.
      FAKEMBY_LOG_FILE: /dev/null

    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      # Use GET, not wget --spider (HEAD); only GET is registered by the app.
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8096/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fakemby-data:
