name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 上多次推送时，取消还在跑的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal tests)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请运行 gofmt -w 后重新提交"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -race：进度缓冲、session 表都是共享状态，并发问题必须在 CI 暴露而不是线上
      - name: go test
        run: go test -race -count=1 ./...

      - name: Theater HTTP compatibility assertions
        run: python3 scripts/dev/probe_theater.py --ci

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint 二进制的构建 Go 版本必须 >= go.mod 里的 go 指令，
      # 否则会直接报 "the Go language version (goX) used to build golangci-lint is lower
      # than the targeted Go version" 并以 exit 3 中止（v2.4.0 用 go1.25 构建，本仓库是 go 1.26.3）。
      # v2.13.2 用 go1.27.0 构建，升级 Go 版本时记得同步检查这一点。
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m
