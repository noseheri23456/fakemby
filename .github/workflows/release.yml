name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - deploy/helm/fakemby/**
      - CHANGELOG.md
  # Manual runs validate only; publication requires a tag push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?", tag)
          if not match:
              raise SystemExit("Use vMAJOR.MINOR.PATCH[-PRERELEASE]; image tags cannot contain build metadata.")
          for part in (match.group(4) or "").split("."):
              if part.isdigit() and len(part) > 1 and part.startswith("0"):
                  raise SystemExit("Numeric prerelease identifiers must not have leading zeroes.")
          if len(tag) - 1 > 128:
              raise SystemExit("The version exceeds the container image tag length limit.")
          PY

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.8.2
          args: check

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Validate Helm chart
        run: |
          helm lint --strict deploy/helm/fakemby
          helm template fakemby deploy/helm/fakemby > "$RUNNER_TEMP/fakemby.yaml"
          helm template fakemby deploy/helm/fakemby \
            --set persistence.existingClaim=fakemby-data \
            --set config.existingConfigMap=fakemby-config > "$RUNNER_TEMP/fakemby-existing.yaml"

      - name: Validate Compose without production secrets
        env:
          FAKEMBY_ADMIN_API_KEY: validation-only-not-a-secret
          FAKEMBY_PLAYBACK_SIGN_KEY: validation-only-not-a-secret
        run: docker compose config --quiet

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Package versioned Helm chart
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          helm package deploy/helm/fakemby --version "$version" \
            --app-version "$version" --destination dist/charts

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
          # Never move latest for a prerelease.
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish release archives and Helm chart
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.8.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
