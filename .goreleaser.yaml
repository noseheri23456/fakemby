version: 2
project_name: fakemby
# Do not clean the repository's existing dist/ runtime files.
dist: dist/release

builds:
  - id: fakemby
    main: ./cmd/fakemby
    binary: fakemby
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # Windows on ARM 没有可用的目标机器，不产出无人验证的产物。
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -mod=readonly
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: fakemby
    formats: [tar.gz]
    # tar.gz 在 Windows 上体验很差，桌面平台统一换成 zip。
    format_overrides:
      - goos: windows
        formats: [zip]
      - goos: darwin
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc

release:
  name_template: "FakEmby {{ .Tag }}"
  prerelease: auto
  # The workflow packages the chart with the same version as the release.
  extra_files:
    - glob: dist/charts/fakemby-*.tgz
